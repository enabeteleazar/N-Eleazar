<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eleazar Nabet — Projects</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="page">

    <header>

      <div class="brand">
        ELEAZAR NABET
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Projects online
      </div>

    </header>


    <main class="main">

      <div class="intro">

        <div class="intro-label">
          Personal projects
        </div>

        <h1>
          My projects
        </h1>

        <p>
          Explore my projects directly from this interface.
          Select a project to display its web interface.
        </p>

      </div>


      <section class="computer">

        <div class="monitor">

          <div class="screen">

            <aside class="projects">

              <div class="projects-title">
                Projects
              </div>

              <div
                class="project-list"
                id="projectList"
              ></div>

            </aside>


            <section class="viewer">

              <div class="browser-bar">

                <div class="browser-dots">
                  <span class="browser-dot"></span>
                  <span class="browser-dot"></span>
                  <span class="browser-dot"></span>
                </div>

                <div
                  class="address"
                  id="address"
                >
                  Sélectionnez un projet
                </div>

              </div>


              <div class="viewer-content">

                <div
                  class="viewer-loading"
                  id="viewerLoading"
                >
                  <div class="loader">
                    <div class="loader-spinner"></div>
                    Chargement du projet…
                  </div>
                </div>

                <iframe
                  id="viewer"
                  title="Aperçu du projet"
                ></iframe>

              </div>

            </section>

          </div>

        </div>

        <div class="monitor-neck"></div>
        <div class="monitor-base"></div>

      </section>

    </main>


    <footer>

      <span>
        © 2026 Eleazar Nabet
      </span>

      <span>

        <a
          href="https://www.linkedin.com/in/eleazar-nabet"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>

        &nbsp;·&nbsp;

        <a href="mailto:nabet.eleazar@gmail.com">
          Contact
        </a>

      </span>

    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
